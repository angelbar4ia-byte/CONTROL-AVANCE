# Render — ObraCtrl (§12.8)
# Un servicio por entorno: dev / staging / prod. El deploy es por Git:
# al hacer push, Render construye y publica.
services:
  - type: web
    name: obractrl-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENTORNO
        value: prod
      - key: DATABASE_URL          # Supabase, con el rol obractrl_api (no owner)
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY     # anon key; la service key NUNCA sale (§10.7)
        sync: false
      - key: CORS_ORIGENES         # origen de Vercel por entorno (§12.8)
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Aviso de EstimacionValidada (§11.3 E.5). Sale del proceso web y no
      # del worker: el bus de eventos es en proceso (§11.1). Sin llave el
      # aviso se registra y no se manda; la validación no se cae por eso.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_REMITENTE
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: obractrl-redis
          property: connectionString

  # Worker de jobs: reportes (xlsx de estimación, PDF de expediente) y
  # recálculo de CPM (§12.2, §11.2 "job")
  - type: worker
    name: obractrl-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # El composition root de los jobs es `obractrl/trabajador.py`, hermano
    # de `main.py` (§12.11). Apuntaba a un módulo que no existe.
    dockerCommand: arq obractrl.trabajador.WorkerSettings
    envVars:
      - key: ENTORNO
        value: prod
      - key: DATABASE_URL
        sync: false
      # El worker también reporta: un reporte que truena en la cola no deja
      # rastro en ninguna respuesta HTTP (§11.7).
      - key: SENTRY_DSN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: obractrl-redis
          property: connectionString

  - type: redis
    name: obractrl-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction   # Arq no puede perder trabajos encolados
    ipAllowList: []               # solo red interna de Render
