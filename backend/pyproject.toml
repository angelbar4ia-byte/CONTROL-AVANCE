[project]
name = "obractrl-api"
version = "0.1.0"
description = "ObraCtrl — API de control de avance de obra (FastAPI)"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

dependencies = [
  # API (§12.2)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",

  # Datos
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",

  # Auth
  "pyjwt[crypto]>=2.10",

  # Jobs (§12.2)
  "arq>=0.26",
  "redis>=5.2",

  # Cargadores y reportes (§9, §12.2)
  "pandas>=2.2",
  "openpyxl>=3.1",
  "weasyprint>=63",

  # Evidencias en R2 (§12.2)
  "boto3>=1.35",

  # Observabilidad
  "sentry-sdk[fastapi]>=2.19",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obractrl"]

# ---------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = [
  "E501",    # el formateador ya controla el largo
  "RUF001",  # el dominio es en español: acentos y "≠" son intencionales
  "RUF002",
  "RUF003",
  # El dominio se nombra en español (§8, lenguaje ubicuo). La convención de
  # excepciones es `ErrorDeX`, que es el equivalente natural de `XError`.
  "N818",
]

# La regla de dependencia (§12.11) la verifica import-linter (abajo), que
# entiende capas. Un `banned-api` de ruff sería global y marcaría también a
# `main.py`, que legítimamente ensambla el borde.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]   # nombres de test descriptivos en español

# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["obractrl"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["arq.*", "weasyprint.*", "boto3.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------
# Linter de arquitectura (§12.11): la regla de dependencia se verifica
# en CI, no solo por disciplina.
[tool.importlinter]
root_package = "obractrl"
# Necesario para poder prohibir paquetes externos (fastapi, sqlalchemy…)
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture: la dependencia apunta hacia adentro"
type = "layers"
layers = [
  "obractrl.adapters",
  "obractrl.application",
  "obractrl.domain",
]
# infrastructure queda fuera de la pila: la consumen adapters y main,
# y no puede ser importada por domain ni application (contrato de abajo).

[[tool.importlinter.contracts]]
name = "El dominio no conoce frameworks ni infraestructura"
type = "forbidden"
source_modules = ["obractrl.domain"]
forbidden_modules = [
  "obractrl.adapters",
  "obractrl.infrastructure",
  "fastapi",
  "sqlmodel",
  "sqlalchemy",
  "pydantic",
  "asyncpg",
  "pandas",
]

[[tool.importlinter.contracts]]
name = "Los casos de uso no tocan la infraestructura directamente"
type = "forbidden"
source_modules = ["obractrl.application"]
forbidden_modules = [
  "obractrl.infrastructure",
  "obractrl.adapters",
  "fastapi",
  "sqlalchemy",
]
