# ============================================================
# ObraCtrl · CI (§12.8)
#
# El DoD de cada fase dice "verde en CI" y hasta ahora no había CI, así que
# era una promesa sin nadie que la verificara.
#
# Lo que hace este archivo que una máquina de desarrollo normalmente no hace:
# **levanta Postgres**. Sin él, `backend/tests/integracion/` se salta entero
# —su `conftest.py` lo declara así— y los archivos de `database/tests/` no
# corren nunca. Son ~150 pruebas y 5 archivos de aislamiento RLS que solo se
# ejercitan aquí.
#
# Las migraciones se aplican contra un Postgres pelón, no contra Supabase: la
# 0014 crea `anon`, `authenticated` y `obractrl_api` justo para que esto sea
# posible con el mismo modelo de permisos que producción.
# ============================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # Un push nuevo cancela la corrida anterior de la misma rama: no sirve
  # esperar el resultado de un commit que ya quedó atrás.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · dominio, integración y RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostGIS, no `postgres:16` a secas: la migración 0057 (cuantificador)
        # guarda trazos y puntos de plano como `geometry` nativo y hace
        # `create extension postgis`. Con la imagen simple el job se caía en
        # esa migración y nunca llegaba a los pasos de abajo. Es la misma
        # versión mayor (16) y trae las mismas variables y el mismo healthcheck.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obractrl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Superusuario: aplica migraciones y arma el escenario de cada prueba.
      # Bypassa RLS a propósito (ver `tests/integracion/conftest.py`).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obractrl
      DATABASE_URL_ADMIN: postgresql+asyncpg://postgres:postgres@localhost:5432/obractrl
      # El rol del backend en producción: NO es owner, así que RLS le aplica.
      # Es contra este que se ejercitan los repos.
      DATABASE_URL_TEST: postgresql+asyncpg://obractrl_api:ci@localhost:5432/obractrl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        working-directory: backend
        # `-c constraints.txt` fija lo que define el contrato. Sin eso, CI
        # resolvía una versión de FastAPI distinta de la probada y el paso
        # del contrato fallaba sin que nadie hubiera tocado un endpoint.
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Aplicar migraciones
        run: bash database/scripts/migrar.sh

      - name: Ida y vuelta de las migraciones
        # Un `down` que nunca corrió no es un `down`: es un archivo. Aquí se
        # revierten en orden inverso contra una base con el esquema puesto, y
        # se vuelven a aplicar. Si un down deja un objeto colgado, el up de
        # vuelta choca contra él y este paso se pone rojo (§12.12).
        #
        # El número de pasos se cuenta en vez de escribirse: estaba fijo en 22
        # cuando ya había 27 migraciones, así que las cinco más nuevas —las
        # que más probable es que tengan un `down` malo— nunca se revertían.
        run: |
          PASOS=$(ls database/migrations/*.sql | wc -l)
          bash database/scripts/revertir.sh --pasos "$PASOS" --si
          bash database/scripts/migrar.sh

      - name: Restauración de respaldo probada
        # Un respaldo no probado no es un respaldo. Esto hace pg_dump de la base
        # ya migrada, la restaura en otra vacía y compara los dos esquemas
        # objeto por objeto (§12.12).
        run: bash database/scripts/probar_respaldo.sh

      - name: Dar contraseña a obractrl_api
        # La 0014 crea el rol sin contraseña a propósito —nunca en un archivo
        # versionado—, así que falla cerrado hasta que cada entorno la fija.
        # Este es el entorno de CI fijando la suya.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role obractrl_api with password 'ci'"

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Regla de dependencia (§12.11)
        working-directory: backend
        run: lint-imports

      - name: Tipos (informativo)
        working-directory: backend
        # `continue-on-error`: mypy entra a CI **para que se vea**, no para
        # bloquear. Quedan 96 hallazgos reales —`arg-type`, `no-any-return`,
        # `attr-defined`— y ponerlos en rojo de golpe obligaría a arreglarlos
        # todos hoy o a ignorar el rojo, que es lo que pasa siempre. Se mira la
        # cuenta: si sube, alguien agregó deuda.
        #
        # Los 198 de `dict` sin parametrizar se aceptaron como convención
        # (`disallow_any_generics = false`, ver `pyproject.toml`), que es lo
        # que hace que estos 96 sean legibles.
        continue-on-error: true
        run: mypy src

      - name: Pruebas (dominio + integración)
        working-directory: backend
        run: pytest -q

      - name: Aislamiento RLS (§12.4)
        run: bash database/scripts/probar.sh

      - name: El contrato está al día
        working-directory: backend
        # El script vive en el repo, así que esto corre igual en local:
        #   python scripts/verificar_contrato.py
        run: python scripts/verificar_contrato.py

      - name: El contrato no rompe a los clientes publicados (§12.12)
        working-directory: backend
        # La otra mitad de la pregunta: el paso de arriba comprueba que el
        # contrato coincida con el código; este, que el cambio sea **aditivo**
        # contra `openapi/publicado.json`. Se puede regenerar el contrato
        # correctamente y, con eso, romper a todos los clientes viejos a la vez
        # — y desde la Fase 15 hay uno que no se actualiza a voluntad: la app
        # de Play (§12.13).
        #
        # Si el cambio es intencional y ya no hay clientes viejos, la línea
        # base se mueve al liberar:
        #   python scripts/verificar_compatibilidad.py --publicar
        run: python scripts/verificar_compatibilidad.py

  frontend:
    name: Web · tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La misma que `frontend/.nvmrc`. No es un detalle: una prueba que
          # tocaba `Response.blob()` pasó en local con Node 26 y falló aquí con
          # Node 20, porque el `Blob` no se comporta igual en los dos. Que las
          # dos versiones estén escritas en el repo es lo que permite
          # reproducir un rojo de CI sin adivinar.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Pruebas
        working-directory: frontend
        run: npm run test

  e2e:
    name: Web · humo en navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        # Solo Chromium: el humo no prueba compatibilidad entre navegadores,
        # prueba que la app arranque. Bajar tres motores costaría minutos por
        # corrida sin decir nada nuevo.
        run: npx playwright install --with-deps chromium

      - name: Humo
        working-directory: frontend
        # Sin `E2E_API_URL`, los specs de `e2e/workflows/` se saltan solos y
        # corre únicamente el humo, que no necesita backend.
        run: npx playwright test

      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  mobile:
    name: Móvil · tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Tipos
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Pruebas
        working-directory: mobile
        # Reglas de captura (§6), comparación de versiones (§12.12) y la
        # clasificación de fallos de las dos colas de salida (§12.5). Nada de
        # esto necesita dispositivo: son módulos puros y dobles de la base.
        run: npm test -- --ci
